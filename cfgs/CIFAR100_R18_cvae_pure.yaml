# CIFAR-100 / ResNet18 — fully buffer-free CVAE replay (cvae_pure)
# T=10, 10 classes per task, 100 classes total
#
# Design
# ------
# No real embeddings are stored for classifier replay.  The CVAE is the sole
# source of old-class embeddings.  On each incremental task the CVAE is trained
# on:
#   (a) real embeddings from the current task  (collected via add_task_samples)
#   (b) synthetic embeddings for all old classes generated by the previous CVAE
#       snapshot, at the same per-class count as the current task.
#
# For balanced CIFAR-100 (500 samples/class), this means:
#   - Task  2:  10 current ×500 real  +  10 old ×500 synthetic  =  10 k rows
#   - Task  5:  10 current ×500 real  +  40 old ×500 synthetic  =  25 k rows
#   - Task 10:  10 current ×500 real  +  90 old ×500 synthetic  =  50 k rows
#
# Catastrophic forgetting inside the CVAE is mitigated by:
#   1. Pre-balanced synthetic replay (see above).
#   2. Teacher KL distillation: student posterior is penalised for diverging
#      from the frozen teacher posterior on the same inputs.
#
# CVAE architecture improvements vs. the old cvae_full config
# -----------------------------------------------------------
# - Class-conditional encoder: q(z | x, y) via [x ‖ class_embed(y)].
# - 3-layer MLPs with LayerNorm + GELU instead of 2-layer ReLU.
# - Larger hidden_dim (256) and latent_dim (64).
# - KL annealing: β warms from beta_floor → cvae_beta over kl_anneal_steps.
# - Per-class latent priors for class-conditional sampling.
# - Feature matching loss: per-class mean/variance alignment.

dataset:
  name: CIFAR100
  batch_size: 256

model:
  backbone: ResNet18
  pretrained: true
  activation: logs
  normalize: false          # Raw ResNet18 embeddings (512-d); CVAE uses relative-MSE
  lamb: 0.01

incremental:
  num_tasks: 10
  classes_per_task: 10
  initial_tasks: 1
  samples_per_task: null
  buffer_size: 0            # No real buffer; ignored in cvae_pure mode
  use_eb: false
  sampling_strategy: random

  replay_backend: cvae_pure

  # CVAE model dimensions — must match ResNet18 output
  cvae_embed_dim: 512
  cvae_latent_dim: 64
  cvae_class_embed_dim: 64
  cvae_hidden_dim: 256

  # Training schedule
  # max_steps is the upper cap per task.  Later tasks have more training data
  # (up to 50 k rows at task 10), so we give the CVAE enough budget.
  cvae_train_max_steps: 5000
  cvae_train_min_steps: 100
  cvae_train_eval_every: 50
  cvae_train_patience: 4

  # Adaptive stopping thresholds
  # cvae_recon_cosine_stop: when normalize=false, the metric is 1 - relative_MSE.
  # 0.93 ≈ relative MSE ≤ 7 %, which is a robust target for raw ResNet18 features.
  # cvae_gen_cosine_stop: not used as a gate in cvae_pure mode (set to 0).
  cvae_recon_cosine_stop: 0.93
  cvae_gen_cosine_stop: 0.0
  cvae_gen_eval_samples_per_class: 64

  # Loss hyperparameters
  cvae_beta: 0.05                       # Final KL weight after annealing
  cvae_beta_floor: 0.0001               # Initial KL weight (start of KL annealing)
  cvae_kl_anneal_steps: 400             # Steps to ramp β from floor → cvae_beta
  cvae_stats_loss_weight: 0.01          # Class-prototype mean-matching weight
  cvae_feature_matching_weight: 0.5     # Per-class moment-matching weight (raised)

  # Sampling diversity floor
  # After the law-of-total-variance fix _class_latent_logvar correctly reflects
  # the true between-sample spread.  This floor is a safety net for edge cases
  # (e.g. single-sample classes, very early tasks) and is typically inactive.
  cvae_min_sampling_std: 0.2

  # Continual learning inside the CVAE
  cvae_teacher_kl: true
  cvae_teacher_kl_weight: 0.1

  # Replay count per old class
  # Leave commented to use the dynamic default (= max samples per class in the
  # current task stream, typically 500 for balanced CIFAR-100).
  # Set a fixed integer to cap replay per old class (e.g., 200 to save memory).
  # generated_per_class: 200

  # Reference buffer: measurement + CVAE anchoring
  # ------------------------------------------------
  # ref_buffer_per_class real embeddings are stored per class in a lightweight
  # buffer that is SEPARATE from the ROLANN training pipeline.
  #
  # Two uses:
  #
  # 1. MEASUREMENT (cvae_measure_quality: true)
  #    After each maintain(), per-class generation metrics (centroid_l2,
  #    std_ratio, cosine_sim, fd, mmd) are logged to diagnose forgetting.
  #    The worst old classes (highest FD) are highlighted.
  #
  # 2. CVAE ANCHORING (ref_buffer_anchor_cvae: true)
  #    The ref_buffer samples are ALSO mixed into the CVAE training data for old
  #    classes, alongside teacher-generated samples.  This prevents the
  #    compounding centroid-drift problem that occurs when the CVAE trains
  #    exclusively on teacher-generated data over many tasks.
  #    The ROLANN classifier is NEVER trained on these samples.
  #
  #    Without anchoring (pure mode), task-1 accuracy degrades ~20 pp per task
  #    because each generation stage compounds a small error.
  #    With anchoring, the centroid L2 and std_ratio stay stable across tasks.
  cvae_measure_quality: true
  ref_buffer_per_class: 100     # real samples per class stored (for both uses)
  cvae_quality_n_gen: 100       # samples generated per class for comparison
  ref_buffer_anchor_cvae: true  # use ref_buffer to anchor CVAE training

  replay_debug: false

training:
  use_wandb: false

output_dir: "./results/CIFAR100_ResNet18/cvae_pure"
device: "cuda"
