# CIFAR-100 / ViT-B16 — fully buffer-free CVAE replay (cvae_pure)
#
# Design
# ------
# No real embeddings are stored for classifier replay.  The CVAE is the sole
# source of old-class embeddings.  On each incremental task the CVAE is trained
# on:
#   (a) real embeddings from the current task  (collected via add_task_samples)
#   (b) synthetic embeddings for all old classes generated by the previous CVAE
#       snapshot, at the same per-class count as the current task.
#
# This creates a perfectly balanced training set and eliminates the need for
# explicit oversampling.
#
# Catastrophic forgetting inside the CVAE is mitigated by:
#   1. Pre-balanced synthetic replay (see above).
#   2. Teacher KL distillation: student posterior is penalised for diverging
#      from the frozen teacher's posterior on the same inputs.
#
# CVAE architecture improvements vs. the old cvae_full config
# -----------------------------------------------------------
# - Class-conditional encoder: q(z | x, y) via [x ‖ class_embed(y)].
# - 3-layer MLPs with LayerNorm + GELU instead of 2-layer ReLU.
# - Larger hidden_dim (256) and latent_dim (64).
# - KL annealing: β warms up from beta_floor → cvae_beta over kl_anneal_steps.
# - Per-class latent priors for class-conditional sampling.
# - Feature matching loss: per-class mean / variance alignment.

dataset:
  name: CIFAR100
  batch_size: 256

model:
  backbone: ViTB16
  pretrained: true
  activation: lin
  normalize: true          # L2-normalise ViT embeddings → cosine recon loss
  lamb: 0.01

incremental:
  num_tasks: 10
  classes_per_task: 10
  initial_tasks: 1
  samples_per_task: null
  buffer_size: 0           # No real buffer; ignored in cvae_pure mode
  sampling_strategy: random

  replay_backend: cvae_pure

  # CVAE model dimensions
  cvae_embed_dim: 768              # Must match ViT-B16 output dimension
  cvae_latent_dim: 64              # Increased from 32 → 64
  cvae_class_embed_dim: 64
  cvae_hidden_dim: 256             # Increased from 128 → 256

  # Training schedule
  cvae_train_max_steps: 3000
  cvae_train_min_steps: 80
  cvae_train_eval_every: 25
  cvae_train_patience: 3

  # Adaptive stopping thresholds
  # In cvae_pure mode, gen_cosine_stop is not used as a gate (set to 0);
  # the reconstruction threshold still governs early stopping.
  cvae_recon_cosine_stop: 0.93
  cvae_gen_cosine_stop: 0.0
  cvae_gen_eval_samples_per_class: 48

  # Loss hyperparameters
  cvae_beta: 0.05                       # Final KL weight after annealing
  cvae_beta_floor: 0.0001               # Initial KL weight (KL annealing start)
  cvae_kl_anneal_steps: 200             # Steps to ramp β from floor to cvae_beta
  cvae_stats_loss_weight: 0.01          # Class-prototype mean-matching weight
  cvae_feature_matching_weight: 0.1     # Per-class moment-matching weight

  # Continual learning inside the CVAE
  cvae_teacher_kl: true
  cvae_teacher_kl_weight: 0.1

  # Replay count per old class (defaults to current-task per-class cardinality)
  # Leave unset to use the dynamic default, or set a fixed integer.
  # generated_per_class: 50

  replay_debug: false

training:
  use_wandb: false

output_dir: "./results/CIFAR100_ViT/cvae_pure"
device: "cuda"
